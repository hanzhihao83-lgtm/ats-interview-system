services:
  postgres:
    image: postgres:16
    container_name: recruitment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruitment}
      POSTGRES_USER: ${POSTGRES_USER:-recruitment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruitment_password}
    ports:
      - "5432:5432"
    volumes:
      - recruitment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-recruitment_user} -d $${POSTGRES_DB:-recruitment}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recruitment_postgres_data:
