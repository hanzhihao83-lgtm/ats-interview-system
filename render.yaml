services:
  - type: web
    name: ats-recruitment-api-hanzhihao
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build:server
    startCommand: npm run db:deploy && npm run start:server
    healthCheckPath: /api/kim/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ats-recruitment-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.22.0
      - key: FRONTEND_ORIGIN
        value: https://ats-interview-system.vercel.app
      - key: UPLOAD_DIR
        value: /tmp/uploads/imports
      - key: AUTO_DASHBOARD_UPLOAD_DIR
        value: /tmp/uploads/auto-dashboards
      - key: KIM_DATA_PATH
        value: /tmp/kim-interviews.json
      - key: MAX_IMPORT_FILE_MB
        value: "15"
      - key: MAX_IMPORT_ROWS
        value: "10000"
      - key: TENCENT_MEETING_MODE
        value: mock
      - key: KIM_SEND_MODE
        value: webhook

databases:
  - name: ats-recruitment-db
    plan: free
    databaseName: recruitment
    user: recruitment_user
